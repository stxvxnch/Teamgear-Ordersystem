spring:
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:teamshop
    driverClassName: org.h2.Driver
    username: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  application:
    name: order-system

server:
  port: 8080

logging:
  level:
    root: info
    com.teamgear: debug
    org.hibernate.sql: debug

